<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏广告文案 + 智能海报生成器</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #18233d;
      --muted: #647195;
      --line: #dbe2f1;
      --primary: #4664ff;
      --primary-2: #7a5cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 0%, #eef3ff 0, #f7f9ff 30%, #f4f6fb 100%);
    }
    .app {
      max-width: 1440px;
      margin: 28px auto;
      padding: 0 18px 24px;
      display: grid;
      grid-template-columns: minmax(420px, 560px) 1fr;
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(33, 57, 121, 0.08);
      padding: 18px;
    }
    h1 { margin: 2px 0 14px; font-size: 26px; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.45; }

    .section {
      border: 1px solid #e7ecf8;
      border-radius: 14px;
      padding: 12px;
      background: #fbfcff;
      margin-bottom: 12px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field { margin-bottom: 10px; }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], input[type="url"], select, textarea {
      width: 100%;
      border: 1px solid #d7deee;
      border-radius: 10px;
      font-size: 14px;
      padding: 10px 11px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      border-color: #97aafc;
      box-shadow: 0 0 0 3px rgba(97, 124, 255, 0.12);
    }
    textarea { min-height: 92px; resize: vertical; }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button.sub { background: #edf1ff; color: #2f447d; border: 1px solid #d6e0ff; }

    .result-container { display: grid; gap: 10px; }
    .list {
      border: 1px solid #dde4f4;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border-top: 1px solid #eef2fb;
    }
    .item:first-child { border-top: none; }
    .item .txt { font-size: 14px; line-height: 1.45; color: #20315c; }
    .chip {
      display: inline-block;
      margin-right: 6px;
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 999px;
      color: #3654b3;
      background: #eaf0ff;
    }

    .stage {
      background: #f9fbff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tip { color: var(--muted); font-size: 12px; }
    .canvas-wrap {
      border-radius: 12px;
      border: 1px solid #d8e0ef;
      background: #fff;
      overflow: auto;
      max-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    #posterCanvas {
      width: min(100%, 460px);
      height: auto;
      border-radius: 10px;
      box-shadow: 0 18px 40px rgba(36, 54, 111, 0.18);
      background: #dfe5f2;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .status { font-size: 12px; color: #5770c2; margin-top: 6px; }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 1fr; }
      .canvas-wrap { max-height: none; }
      #posterCanvas { width: min(100%, 560px); }
      .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <h1>游戏广告文案 + 智能海报生成器</h1>
      <p class="desc">纯 HTML/CSS/JavaScript 单文件，支持离线。可上传图片或在线加载背景图，并自动分析图片亮度与复杂度，选择更易读的文案排版区域。</p>

      <div class="section">
        <h2>1) 文案参数</h2>
        <div class="field">
          <label for="gameName"><span>游戏名</span></label>
          <input id="gameName" type="text" value="星际远征" placeholder="例如：星际远征" />
        </div>
        <div class="field">
          <label for="sellingPoints"><span>卖点（多行）</span><span>每行一个</span></label>
          <textarea id="sellingPoints">高自由度宇宙探索
史诗级舰队对战
好友协作副本
每日奖励不停</textarea>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="language">目标语言</label>
            <select id="language">
              <option value="zh">zh</option>
              <option value="en">en</option>
              <option value="de">de</option>
              <option value="tr">tr</option>
            </select>
          </div>
          <div class="field">
            <label for="tone">语气</label>
            <select id="tone">
              <option value="casual">casual</option>
              <option value="professional">professional</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="limit">字符上限（每条）</label>
            <input id="limit" type="number" min="20" max="220" value="68" />
          </div>
          <div class="field">
            <label for="theme">风格（按钮/点缀）</label>
            <select id="theme">
              <option value="cyber">cyber</option>
              <option value="dark">dark</option>
              <option value="cute">cute</option>
              <option value="minimal">minimal</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>2) 背景图（推荐）</h2>
        <div class="field">
          <label for="bgImageUpload">上传背景图</label>
          <input id="bgImageUpload" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label for="bgImageUrl">或在线图片 URL（可联网）</label>
          <input id="bgImageUrl" type="url" placeholder="https://..." />
        </div>
        <div class="buttons">
          <button id="loadUrlBtn" class="sub" type="button">加载 URL 背景</button>
          <button id="clearBgBtn" class="sub" type="button">清除背景图</button>
        </div>
        <p class="desc" style="margin-top:8px;">提示：若来源站点不允许跨域，浏览器可能限制导出 PNG（Canvas 污染）。尽量使用允许 CORS 的图片地址。</p>
      </div>

      <div class="section">
        <h2>3) 主视觉图（可选）</h2>
        <div class="field">
          <label for="heroImage">上传主视觉图（拖拽移动 + 滚轮缩放）</label>
          <input id="heroImage" type="file" accept="image/*" />
        </div>
      </div>

      <div class="buttons">
        <button id="generateBtn">生成 10 条文案 + 3 CTA</button>
        <button id="copyAllBtn" class="sub">复制全部</button>
        <button id="csvBtn" class="sub">下载 CSV</button>
        <button id="rerenderBtn" class="sub">刷新海报</button>
        <button id="exportBtn" class="sub">导出 PNG</button>
      </div>

      <div id="results" class="result-container" style="margin-top:14px;"></div>
    </section>

    <section class="stage">
      <div class="toolbar">
        <h2 style="margin:0;">海报预览（1080 × 1920）</h2>
        <span class="tip">自动布局：根据背景图可读性选择文案区域</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="posterCanvas" width="1080" height="1920"></canvas>
      </div>
      <div id="status" class="status">就绪</div>
    </section>
  </div>

  <script>
    const ui = {
      gameName: document.getElementById('gameName'),
      sellingPoints: document.getElementById('sellingPoints'),
      language: document.getElementById('language'),
      tone: document.getElementById('tone'),
      limit: document.getElementById('limit'),
      theme: document.getElementById('theme'),
      bgImageUpload: document.getElementById('bgImageUpload'),
      bgImageUrl: document.getElementById('bgImageUrl'),
      loadUrlBtn: document.getElementById('loadUrlBtn'),
      clearBgBtn: document.getElementById('clearBgBtn'),
      heroImage: document.getElementById('heroImage'),
      generateBtn: document.getElementById('generateBtn'),
      copyAllBtn: document.getElementById('copyAllBtn'),
      csvBtn: document.getElementById('csvBtn'),
      rerenderBtn: document.getElementById('rerenderBtn'),
      exportBtn: document.getElementById('exportBtn'),
      results: document.getElementById('results'),
      status: document.getElementById('status'),
      canvas: document.getElementById('posterCanvas')
    };

    const ctx = ui.canvas.getContext('2d');
    const bgAnalyzeCanvas = document.createElement('canvas');
    bgAnalyzeCanvas.width = 1080;
    bgAnalyzeCanvas.height = 1920;
    const bgAnalyzeCtx = bgAnalyzeCanvas.getContext('2d', { willReadFrequently: true });

    const state = {
      ads: [],
      ctas: [],
      bgImg: null,
      heroImg: null,
      heroTransform: { x: 540, y: 820, scale: 1, dragging: false, startX: 0, startY: 0 },
      layout: { y: 250, panel: 'rgba(0,0,0,0.45)', title: '#fff', bullet: '#f3f7ff', ctaText: '#fff' }
    };

    const lexicon = {
      zh: {
        casual: {
          starters: ['马上开打', '冲就完事', '今晚就上号', '别等了', '速来体验'],
          hooks: ['沉浸感拉满', '爽快节奏', '零门槛上手', '细节很上头', '朋友都在玩'],
          ctas: ['立即开玩', '马上下载', '现在加入']
        },
        professional: {
          starters: ['全新版本上线', '高品质体验', '策略与操作并重', '次世代视觉表现', '深度成长体系'],
          hooks: ['稳定流畅', '内容持续更新', '多维玩法设计', '社交协作丰富', '长期运营保障'],
          ctas: ['立即体验', '预约下载', '加入战局']
        }
      },
      en: {
        casual: {
          starters: ['Jump in now', 'Ready to roll', 'Start tonight', 'No waiting', 'Your squad is here'],
          hooks: ['pure hype', 'easy to pick up', 'fast-paced fun', 'packed with rewards', 'crazy good vibes'],
          ctas: ['Play Now', 'Download Today', 'Join the Action']
        },
        professional: {
          starters: ['New season available', 'Premium gameplay', 'Built for strategic depth', 'High-end visual quality', 'Competitive-ready systems'],
          hooks: ['stable performance', 'ongoing live updates', 'strong retention design', 'co-op and PvP balance', 'clear progression loop'],
          ctas: ['Experience Now', 'Install Now', 'Enter the Arena']
        }
      },
      de: {
        casual: {
          starters: ['Jetzt einsteigen', 'Los geht’s', 'Heute Abend starten', 'Nicht warten', 'Team wartet schon'],
          hooks: ['macht sofort Spaß', 'leicht zu lernen', 'schnelles Gameplay', 'starke Belohnungen', 'richtig gute Stimmung'],
          ctas: ['Jetzt spielen', 'Jetzt downloaden', 'Direkt mitmachen']
        },
        professional: {
          starters: ['Neue Saison ist live', 'Hochwertiges Spielerlebnis', 'Strategie trifft Action', 'Moderne Grafikqualität', 'Tiefes Fortschrittssystem'],
          hooks: ['stabile Performance', 'regelmäßige Updates', 'vielfältige Modi', 'Teamfokus und Wettbewerb', 'nachhaltige Motivation'],
          ctas: ['Jetzt erleben', 'Installieren', 'Zur Arena']
        }
      },
      tr: {
        casual: {
          starters: ['Hemen başla', 'Şimdi dal', 'Bu akşam oyundayız', 'Bekleme', 'Ekibin hazır'],
          hooks: ['çok akıcı', 'öğrenmesi kolay', 'hızlı tempolu', 'ödül dolu', 'tam keyif modu'],
          ctas: ['Hemen Oyna', 'Şimdi İndir', 'Mücadeleye Katıl']
        },
        professional: {
          starters: ['Yeni sezon yayında', 'Kaliteli oyun deneyimi', 'Strateji ve aksiyon dengesi', 'Gelişmiş görsel kalite', 'Derin ilerleme sistemi'],
          hooks: ['kararlı performans', 'sürekli içerik güncellemesi', 'çok yönlü modlar', 'takım odaklı yapı', 'uzun vadeli bağlılık'],
          ctas: ['Şimdi Deneyimle', 'Hemen Yükle', 'Arenaya Katıl']
        }
      }
    };

    const themes = {
      cyber: { cta: '#00b7ff', panelTint: 'rgba(0, 10, 35, 0.45)', badge: '#7ce8ff' },
      dark: { cta: '#f0567d', panelTint: 'rgba(12, 10, 14, 0.5)', badge: '#ff9ab4' },
      cute: { cta: '#ff66af', panelTint: 'rgba(255,255,255,0.42)', badge: '#8b63ff' },
      minimal: { cta: '#1f3f74', panelTint: 'rgba(255,255,255,0.38)', badge: '#243c66' }
    };

    function setStatus(text, isWarn = false) {
      ui.status.textContent = text;
      ui.status.style.color = isWarn ? '#b05f25' : '#5770c2';
    }

    function getSellingPoints() {
      return ui.sellingPoints.value.split('\n').map(s => s.trim()).filter(Boolean);
    }

    function clampText(text, maxLen) {
      if (text.length <= maxLen) return text;
      return text.slice(0, Math.max(0, maxLen - 1)).trimEnd() + '…';
    }

    function pick(arr, idx) { return arr[idx % arr.length]; }

    function generateCopies() {
      const game = ui.gameName.value.trim() || 'Untitled Game';
      const points = getSellingPoints();
      const lang = ui.language.value;
      const tone = ui.tone.value;
      const limit = Math.max(20, Number(ui.limit.value) || 68);
      const dict = (lexicon[lang] && lexicon[lang][tone]) || lexicon.en.casual;

      const ads = [];
      for (let i = 0; i < 10; i++) {
        const starter = pick(dict.starters, i);
        const hook = pick(dict.hooks, i + 2);
        const point = points.length ? pick(points, i) : '';
        const text = [starter, game, point, hook].filter(Boolean).join(' · ');
        ads.push(clampText(text, limit));
      }

      const ctas = dict.ctas.slice(0, 3).map(c => clampText(c, limit));
      state.ads = ads;
      state.ctas = ctas;
      renderResults();
      renderPoster();
    }

    function renderResults() {
      ui.results.innerHTML = '';
      const frag = document.createDocumentFragment();

      const createList = (title, items, prefix) => {
        const h = document.createElement('h2');
        h.textContent = title;
        const list = document.createElement('div');
        list.className = 'list';

        items.forEach((text, i) => {
          const row = document.createElement('div');
          row.className = 'item';
          const txt = document.createElement('div');
          txt.className = 'txt';
          txt.innerHTML = `<span class="chip">${prefix} ${i + 1}</span>${escapeHtml(text)}`;
          const btn = document.createElement('button');
          btn.className = 'sub';
          btn.textContent = '复制';
          btn.addEventListener('click', () => copyText(text));
          row.append(txt, btn);
          list.appendChild(row);
        });
        frag.append(h, list);
      };

      createList('广告短文案（10）', state.ads, 'Ad');
      createList('CTA（3）', state.ctas, 'CTA');
      ui.results.appendChild(frag);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>\"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        setStatus('已复制到剪贴板');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        setStatus('已复制到剪贴板（兼容模式）');
      }
    }

    function copyAll() {
      const lines = [
        ...state.ads.map((t, i) => `Ad ${i + 1},${csvEscape(t)}`),
        ...state.ctas.map((t, i) => `CTA ${i + 1},${csvEscape(t)}`)
      ].join('\n');
      copyText(lines);
    }

    function csvEscape(s) {
      return `"${String(s).replace(/"/g, '""')}"`;
    }

    function downloadCSV() {
      const rows = [['type', 'index', 'text']];
      state.ads.forEach((t, i) => rows.push(['ad', String(i + 1), t]));
      state.ctas.forEach((t, i) => rows.push(['cta', String(i + 1), t]));
      const content = rows.map(r => r.map(csvEscape).join(',')).join('\n');
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ad_copies.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus('CSV 已下载');
    }

    function drawFallbackBackground() {
      const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
      grad.addColorStop(0, '#2a4fd8');
      grad.addColorStop(0.6, '#5f63ff');
      grad.addColorStop(1, '#9e7eff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.globalAlpha = 0.16;
      for (let i = 0; i < 14; i++) {
        ctx.fillStyle = i % 2 ? '#fff' : '#c7d4ff';
        ctx.beginPath();
        ctx.arc((i * 157) % 1080, (i * 251) % 1920, 48 + (i % 5) * 20, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawImageCover(image, drawCtx) {
      const cw = 1080;
      const ch = 1920;
      const scale = Math.max(cw / image.width, ch / image.height);
      const w = image.width * scale;
      const h = image.height * scale;
      const x = (cw - w) / 2;
      const y = (ch - h) / 2;
      drawCtx.drawImage(image, x, y, w, h);
    }

    function drawBackground() {
      if (state.bgImg) {
        drawImageCover(state.bgImg, ctx);
        return;
      }
      drawFallbackBackground();
    }

    function drawHeroImage() {
      if (!state.heroImg) return;
      const { x, y, scale } = state.heroTransform;
      const w = 760 * scale;
      const h = state.heroImg.height / state.heroImg.width * w;

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 24;
      ctx.globalAlpha = 0.98;
      ctx.drawImage(state.heroImg, x - w / 2, y - h / 2, w, h);
      ctx.restore();
    }

    function evaluateRegionLuma(x, y, w, h) {
      const imgData = bgAnalyzeCtx.getImageData(x, y, w, h).data;
      let sum = 0;
      let sumSq = 0;
      const total = imgData.length / 4;
      for (let i = 0; i < imgData.length; i += 4) {
        const lum = 0.2126 * imgData[i] + 0.7152 * imgData[i + 1] + 0.0722 * imgData[i + 2];
        sum += lum;
        sumSq += lum * lum;
      }
      const avg = sum / total;
      const variance = Math.max(0, sumSq / total - avg * avg);
      const std = Math.sqrt(variance);
      return { avg, std };
    }

    function autoLayoutFromBackground() {
      const candidates = [250, 760, 1210];
      const rect = { x: 80, w: 920, h: 560 };

      bgAnalyzeCtx.clearRect(0, 0, 1080, 1920);
      if (state.bgImg) {
        drawImageCover(state.bgImg, bgAnalyzeCtx);
      } else {
        const g = bgAnalyzeCtx.createLinearGradient(0, 0, 1080, 1920);
        g.addColorStop(0, '#2a4fd8');
        g.addColorStop(1, '#9e7eff');
        bgAnalyzeCtx.fillStyle = g;
        bgAnalyzeCtx.fillRect(0, 0, 1080, 1920);
      }

      let best = null;
      for (const y of candidates) {
        const { avg, std } = evaluateRegionLuma(rect.x, y, rect.w, rect.h);
        const smoothness = 255 - Math.min(255, std * 4);
        const contrastPotential = Math.max(Math.abs(avg - 26), Math.abs(avg - 230));
        const score = smoothness * 0.7 + contrastPotential * 0.3;
        if (!best || score > best.score) best = { y, avg, std, score };
      }

      const useDarkText = best.avg > 150;
      const panelAlpha = Math.max(0.3, Math.min(0.62, 0.58 - best.std / 180));
      state.layout = {
        y: best.y,
        panel: useDarkText ? `rgba(255,255,255,${panelAlpha.toFixed(2)})` : `rgba(0,0,0,${panelAlpha.toFixed(2)})`,
        title: useDarkText ? '#1b2440' : '#ffffff',
        bullet: useDarkText ? '#243764' : '#ecf3ff',
        ctaText: '#ffffff'
      };
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, color, font, maxLines = 3) {
      ctx.font = font;
      ctx.fillStyle = color;
      let line = '';
      let curY = y;
      let lineCount = 1;
      for (const ch of text) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, curY);
          line = ch;
          curY += lineHeight;
          lineCount++;
          if (lineCount > maxLines) {
            ctx.fillText('…', x + maxWidth - 24, curY - lineHeight);
            return curY;
          }
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, curY);
      return curY;
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function renderPoster() {
      autoLayoutFromBackground();
      drawBackground();
      drawHeroImage();

      const t = themes[ui.theme.value] || themes.cyber;
      const game = ui.gameName.value.trim() || 'Untitled Game';
      const points = getSellingPoints().slice(0, 3);
      const ctaText = state.ctas[0] || ({ zh: '立即体验', en: 'Play Now', de: 'Jetzt spielen', tr: 'Hemen Oyna' }[ui.language.value] || 'Play Now');

      const panelX = 80;
      const panelY = state.layout.y;
      const panelW = 920;
      const panelH = 580;

      ctx.save();
      ctx.fillStyle = state.layout.panel;
      roundRect(ctx, panelX, panelY, panelW, panelH, 34);
      ctx.fill();

      ctx.fillStyle = `${t.badge}E6`;
      roundRect(ctx, panelX + 26, panelY + 28, 190, 48, 24);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('AD CREATIVE', panelX + 45, panelY + 60);

      ctx.font = 'bold 78px sans-serif';
      const titleBottom = drawWrappedText(game, panelX + 34, panelY + 150, 850, 86, state.layout.title, 'bold 78px sans-serif', 2);

      let py = titleBottom + 64;
      points.forEach((p) => {
        ctx.fillStyle = state.layout.bullet;
        ctx.font = '700 40px sans-serif';
        ctx.fillText('•', panelX + 38, py);
        py = drawWrappedText(p, panelX + 82, py, 790, 48, state.layout.bullet, '600 39px sans-serif', 2) + 22;
      });

      ctx.fillStyle = t.cta;
      roundRect(ctx, panelX + 36, panelY + panelH - 156, 848, 104, 52);
      ctx.fill();
      ctx.fillStyle = state.layout.ctaText;
      ctx.font = 'bold 50px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ctaText, 540, panelY + panelH - 88);
      ctx.textAlign = 'start';
      ctx.restore();
    }

    function exportPNG() {
      try {
        const a = document.createElement('a');
        a.href = ui.canvas.toDataURL('image/png');
        a.download = 'poster_1080x1920.png';
        a.click();
        setStatus('PNG 已导出');
      } catch (err) {
        setStatus('导出失败：背景图可能跨域限制，请更换支持 CORS 的 URL', true);
      }
    }

    async function loadImageFromUrl(url) {
      if (!url) return;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.referrerPolicy = 'no-referrer';
      const loaded = new Promise((resolve, reject) => {
        img.onload = () => resolve(img);
        img.onerror = reject;
      });
      img.src = url;
      try {
        state.bgImg = await loaded;
        setStatus('URL 背景图加载成功');
        renderPoster();
      } catch {
        setStatus('URL 背景图加载失败，请检查链接或跨域策略', true);
      }
    }

    function bindCanvasInteraction() {
      ui.canvas.addEventListener('mousedown', (e) => {
        if (!state.heroImg) return;
        state.heroTransform.dragging = true;
        state.heroTransform.startX = e.offsetX;
        state.heroTransform.startY = e.offsetY;
      });

      window.addEventListener('mouseup', () => state.heroTransform.dragging = false);

      ui.canvas.addEventListener('mousemove', (e) => {
        if (!state.heroTransform.dragging || !state.heroImg) return;
        const ratio = ui.canvas.width / ui.canvas.getBoundingClientRect().width;
        const dx = (e.offsetX - state.heroTransform.startX) * ratio;
        const dy = (e.offsetY - state.heroTransform.startY) * ratio;
        state.heroTransform.x += dx;
        state.heroTransform.y += dy;
        state.heroTransform.startX = e.offsetX;
        state.heroTransform.startY = e.offsetY;
        renderPoster();
      });

      ui.canvas.addEventListener('wheel', (e) => {
        if (!state.heroImg) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.05 : 0.05;
        state.heroTransform.scale = Math.max(0.3, Math.min(2.8, state.heroTransform.scale + delta));
        renderPoster();
      }, { passive: false });
    }

    function setupEvents() {
      ui.generateBtn.addEventListener('click', generateCopies);
      ui.copyAllBtn.addEventListener('click', copyAll);
      ui.csvBtn.addEventListener('click', downloadCSV);
      ui.rerenderBtn.addEventListener('click', renderPoster);
      ui.exportBtn.addEventListener('click', exportPNG);

      ui.gameName.addEventListener('input', renderPoster);
      ui.sellingPoints.addEventListener('input', renderPoster);
      ui.theme.addEventListener('change', renderPoster);
      ui.language.addEventListener('change', generateCopies);
      ui.tone.addEventListener('change', generateCopies);
      ui.limit.addEventListener('change', generateCopies);

      ui.bgImageUpload.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            state.bgImg = img;
            setStatus('本地背景图加载成功');
            renderPoster();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      ui.loadUrlBtn.addEventListener('click', () => loadImageFromUrl(ui.bgImageUrl.value.trim()));
      ui.clearBgBtn.addEventListener('click', () => {
        state.bgImg = null;
        setStatus('已清除背景图，使用默认背景');
        renderPoster();
      });

      ui.heroImage.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            state.heroImg = img;
            state.heroTransform = { x: 540, y: 820, scale: 1, dragging: false, startX: 0, startY: 0 };
            setStatus('主视觉图已加载，可拖拽和滚轮缩放');
            renderPoster();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      bindCanvasInteraction();
    }

    setupEvents();
    generateCopies();
  </script>
</body>
</html>
