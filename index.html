<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOL 合作管理器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar card">
    <h1>KOL 合作管理器</h1>
    <div class="stats" id="budgetStats"></div>
  </header>

  <section class="card controls">
    <div class="row">
      <input id="searchInput" placeholder="搜索名称/备注..." />
      <select id="filterCountry"><option value="">全部国家</option></select>
      <select id="filterPlatform"><option value="">全部平台</option><option>YouTube</option><option>TikTok</option><option>IG</option></select>
      <select id="filterStatus"><option value="">全部状态</option></select>
      <select id="filterOwner"><option value="">全部负责人</option></select>
    </div>
    <div class="row">
      <button id="addBtn">+ 新增合作</button>
      <button id="exportCsvBtn">导出合作 CSV</button>
      <button id="exportFollowupBtn">导出待跟进 CSV</button>
      <button id="exportSummaryBtn">导出费用汇总 CSV</button>
      <label class="upload-btn">导入 CSV<input id="importCsvInput" type="file" accept=".csv" hidden /></label>
    </div>
  </section>

  <section class="card">
    <h2>负责人 / 国家配置</h2>
    <div class="row">
      <input id="ownerInput" placeholder="负责人姓名" />
      <select id="ownerCountryInput"></select>
      <button id="addOwnerBtn">添加负责人</button>
    </div>
    <div id="ownerList" class="owner-list"></div>
  </section>

  <section class="card">
    <h2>Pipeline 看板</h2>
    <div id="board" class="board"></div>
  </section>

  <section class="card">
    <h2>合作表格（精简）</h2>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>KOL 素材库（Brief + 素材 + 链接验收）</h2>
    <div class="table-wrap">
      <table>
        <thead><tr id="assetHead"></tr></thead>
        <tbody id="assetBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>待跟进清单（自动 + 手动）</h2>
    <div class="row">
      <input id="manualFollowupName" placeholder="KOL/事项名称" />
      <input id="manualFollowupDate" type="date" />
      <input id="manualFollowupOwner" placeholder="负责人" />
      <input id="manualFollowupAction" placeholder="跟进行动" />
      <button id="addFollowupBtn">添加待跟进</button>
    </div>
    <ul id="followupList" class="followup-list"></ul>
  </section>

  <section class="card help">
    <h2>使用说明</h2>
    <ol>
      <li>先在负责人配置中添加负责人和国家（下拉选项），再新增合作。</li>
      <li>合作表格只保留核心字段，操作列只保留“删除”。</li>
      <li>Brief/素材/发布链接统一放在“KOL素材库”表格，并可标记素材是否已齐。</li>
      <li>国家和语言都是下拉选项（语言为常用欧洲语言）。</li>
      <li>待跟进支持自动提醒 + 手动添加/删除，全部本地保存。</li>
    </ol>
  </section>

  <script src="app.js"></script>
</body>
</html>
