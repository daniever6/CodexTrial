<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动游戏深度调查录入器（EU）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>移动游戏深度调查录入器（EU）</h1>
    <div class="toolbar">
      <button id="newDbBtn">新建空数据库</button>
      <label class="file-btn">加载 games.db<input id="loadDbInput" type="file" accept=".db,.sqlite,.sqlite3" hidden /></label>
      <button id="exportDbBtn">导出当前 games.db</button>
      <span id="dbStatus">未初始化</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="form">新增调查</button>
    <button class="tab" data-tab="list">游戏列表</button>
    <button class="tab" data-tab="stats">共性统计</button>
    <button class="tab" data-tab="exports">导出</button>
  </nav>

  <main>
    <section class="tab-page active" id="tab-form">
      <form id="gameForm"></form>
    </section>

    <section class="tab-page" id="tab-list">
      <div class="filters">
        <input id="searchInput" placeholder="搜索 game / publisher" />
        <select id="filterGenre"></select>
        <select id="filterMonetization"></select>
        <select id="filterLiveOps"></select>
        <select id="filterEu"></select>
        <select id="filterPotential"></select>
        <button id="resetFiltersBtn">重置筛选</button>
      </div>
      <table id="listTable"></table>
    </section>

    <section class="tab-page" id="tab-stats">
      <div class="stats-topbar">
        <label><input type="checkbox" id="includeUnknown" /> 包含 Unknown</label>
        <button id="exportSummaryBtn">导出 summary.csv</button>
      </div>
      <div id="freqCards" class="grid"></div>
      <div class="grid two">
        <div>
          <h3>交叉表：Genre × Monetization</h3>
          <div id="crossGenreMonetization"></div>
        </div>
        <div>
          <h3>交叉表：IAP #1 × LiveOps</h3>
          <div id="crossIapLiveops"></div>
        </div>
      </div>
      <div>
        <h3>Top 组合（Genre + iap_primary_1 + liveops_cadence）</h3>
        <label>Top N: <input id="topN" type="number" min="1" max="100" value="10" /></label>
        <div id="topCombos"></div>
      </div>
    </section>

    <section class="tab-page" id="tab-exports">
      <div class="card">
        <button id="exportAllCsvBtn">导出全量 CSV</button>
        <button id="exportFilteredCsvBtn">导出筛选结果 CSV</button>
        <button id="exportExcelBtn">导出 Excel（单 Sheet）</button>
      </div>
    </section>
  </main>

  <script src="assets/sql-wasm.js"></script>
  <script src="assets/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
